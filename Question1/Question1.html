<body>
    <div id="demo"></div>
 <script>
// Template given

let text = '{ "employees" : [' +
'{ "firstName":"John" , "lastName":"Doe" },' +
'{ "firstName":"Anna" , "lastName":"Smith" },' +
'{ "firstName":"Peter" , "lastName":"Jones" } ]}';

// Change from string to object 
const employeedata = JSON.parse(text);

const demo = document.getElementById("demo");

// interation
let workers = "";

employeedata.employees.forEach(employee => {
    workers += `<li>${employee.firstName} ${employee.lastName}</li>`;
});
demo.innerHTML = `<ul>${workers}</ul>`;


</script>
    
</body>
